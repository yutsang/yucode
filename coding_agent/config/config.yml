provider:
  # KPMG Workbench gateway (Azure-OpenAI-compatible APIM), GPT-5.5.
  # Fill in api_key / Ocp-Apim-Subscription-Key / x-kpmg-charge-code on the
  # deployment machine — see docs/settings.workbench.yml for the annotated
  # copy-paste template and WORKBENCH_PLAN.md for the full on-site checklist.
  name: workbench
  type: openai_compatible
  base_url: "https://api.workbench.kpmg/genai/azure/openai"
  api_version: "2024-12-01-preview"
  model: "gpt-5-5-2026-04-24-gs-sdc"
  api_key: ""
  verify_tls: false
  stream: true
  streaming_mode: no_stream
  temperature: 0.0
  request_timeout_seconds: 300
  omit_params:
    - temperature
  extra_headers:
    Ocp-Apim-Subscription-Key: ""
    x-kpmg-charge-code: ""
    x-kpmg-region-override: "westeurope"
  extra_body:
    reasoning_effort: "medium"
  # ---------------------------------------------------------------------
  # Alternate provider example (plain OpenAI-compatible endpoint, no Azure
  # deployment routing) — uncomment and fill in api_key to use instead:
  # name: deepseek
  # type: openai_compatible
  # base_url: "https://api.deepseek.com"
  # api_key: ""
  # model: deepseek-chat
  # chat_path: /chat/completions
  # append_chat_path: true
  # verify_tls: true
  # streaming_mode: hybrid
  # temperature: 0.0
  # ---------------------------------------------------------------------
runtime:
  permission_mode: workspace-write
  max_iterations: 32
  max_worker_steps: 20
  # Coordinator retry rounds (research->work->validate) on validation failure --
  # separate from max_iterations because one retry here reruns a whole worker,
  # not one LLM turn. Keeps a rejected validation from redoing the work phase
  # up to max_iterations times.
  max_coordinator_retries: 3
  orchestration_mode: auto
  parallel_workers: false
  max_tool_calls: 80
  dedup_tool_threshold: 3
  auto_save_session: true
  auto_resume_latest: true
  compact_preserve_recent: 4
  compact_token_threshold: 10000
  compact_strategy: heuristic
  error_strategy: resilient
  shell_timeout_seconds: 30
  include_git_context: true
  config_dump_in_prompt: true
  # Shrink old tool results in the request sent to the provider once context
  # usage passes half of compact_token_threshold (session history on disk is
  # untouched).
  prune_tool_results: true
  prune_keep_last_turns: 3
  prune_soft_trim_threshold: 4000
  prune_soft_trim_head: 1500
  prune_soft_trim_tail: 1500
  prune_hard_clear_turns: 10
  # Convert a foreground bash command that hits its timeout into a
  # background task instead of killing it outright.
  auto_background_on_timeout: false
  todo_nudge_enabled: true
  todo_nudge_turns_since_write: 3
  todo_nudge_min_gap_turns: 5
  todo_gate_enabled: false
  todo_gate_max_fires_per_prompt: 2
  agents_md_discovery_enabled: true
  skill_discovery_enabled: true
tools:
  allowed: []
  disabled: []
mcp:
  servers: []
vscode:
  auto_start_backend: true
  python_command: ""
  startup_timeout_seconds: 15
hooks:
  pre_tool_use: []
  post_tool_use: []
  pre_compact: []
  post_compact: []
plugins:
  enabled_plugins: []
  extra_dirs: []
sandbox:
  enabled: null
  namespace_restrictions: null
  network_isolation: null
  filesystem_mode: workspace-only
  allowed_mounts: []
logging:
  level: INFO
  format: text
  file: ""
audit:
  enabled: true
instruction_files: []
